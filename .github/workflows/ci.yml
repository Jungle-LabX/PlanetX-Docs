name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check generated documentation
        shell: bash
        run: |
          npm run docs:generate
          generated_status="$(
            git status --porcelain=v1 --untracked-files=all -- \
              content/generated-docs.json \
              migration/document-map.json \
              migration/source-inventory.json \
              migration/terminology.en-ko.json \
              migration/unresolved-documents.md \
              public/downloads \
              public/images/docs
          )"
          if [[ -n "${generated_status}" ]]; then
            printf '%s\n' 'Generated documentation is not committed:' "${generated_status}"
            exit 1
          fi
      - name: Validate documentation
        run: npm run docs:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test rendered routes
        run: node --test tests/rendered-html.test.mjs
